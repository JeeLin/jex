[workspace]
members = ["crates/jex-core", "crates/jex-cli"]
resolver = "2"

[workspace.package]
version = "0.26.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.28"
atty = "0.2"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"] }
quick-xml = "0.37"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
jex-core = { path = "crates/jex-core" }
dirs = "5.0"
notify = "7"
tempfile = "3"
